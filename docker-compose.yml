services:
  postgres:
    image: postgres:${POSTGRES_TAG:-17}
    environment:
      POSTGRES_DB: rgvc
      POSTGRES_USER: rgvc
      POSTGRES_PASSWORD: rgvc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgvc -d rgvc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=rgvc;Username=rgvc;Password=rgvc
      System__Version: ${SYSTEM_VERSION:-local-dev-tag}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - .:/src
      - dotnet_nuget:/root/.nuget/packages
    working_dir: /src/src/Rgvc.Api
    command: ["dotnet", "watch", "run", "--no-restore", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]

volumes:
  dotnet_nuget:
  postgres_data:
