services:
  postgres:
    image: postgres:${POSTGRES_TAG:-17}
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${DEVICE_IMAGE:-workflow-api}:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        SRC_PREFIX: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WORKFLOW_API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=workflow;Username=workflow;Password=workflow
      System__Version: ${SYSTEM_VERSION:-local-dev-tag}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - ..:/src
      - dotnet_nuget:/root/.nuget/packages
    working_dir: /src/core/Workflow.Api
    command: ["dotnet", "watch", "--project", "/src/core/Workflow.Api/Workflow.Api.csproj", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]

volumes:
  dotnet_nuget:
  postgres_data:
